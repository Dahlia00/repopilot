name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: macos-latest
    env:
      GITHUB_WRITE_ENABLED: "false"
      LOG_LEVEL: ERROR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements.txt
      - run: backend/.venv/bin/python -m compileall -q -x '/.venv/' backend
      - run: backend/.venv/bin/python -m unittest discover -s backend -p 'test_*.py'
      - run: backend/.venv/bin/python scripts/check_security.py
      - run: backend/.venv/bin/python benchmark/run_benchmark.py
  semgrep:
    runs-on: ubuntu-latest
    env:
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep==1.180.0
      - run: semgrep scan --config backend/semgrep-rules.yml --metrics off --disable-version-check --error backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
